name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Reglas del workspace (solo std, sin unsafe)
      run: ./scripts/check-std-only.sh
    - name: Documentación como puerta de calidad
      run: ./scripts/check-docs.sh
    # Capa "lint" del gauntlet de old-coder (github.com/AmazingAng/old-coder):
    # cero warnings nuevos, con `-D warnings` para que la puerta falle
    # (exit nonzero) en vez de solo reportar.
    - name: Gauntlet — clippy sin warnings
      run: cargo clippy --workspace --all-targets -- -D warnings

  # Criterio 2 de tutorial/la-rueda-de-serie.md: la seguridad de las
  # dependencias es un paso de workflow, como check-std-only.sh.
  # `cargo deny check` cubre las cuatro patas: advisories (RUSTSEC),
  # licencias (lista blanca de deny.toml), duplicados y fuentes.
  auditoria:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: cargo deny (RUSTSEC, licencias, duplicados, fuentes)
      uses: EmbarkStudios/cargo-deny-action@v2
