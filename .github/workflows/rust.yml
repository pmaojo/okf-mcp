name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Reglas del workspace (solo std, sin unsafe)
      run: ./scripts/check-std-only.sh
    - name: Documentación como puerta de calidad
      run: ./scripts/check-docs.sh
