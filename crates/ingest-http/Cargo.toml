# ADAPTADOR: dependencias externas permitidas
#
# Implementación HTTP del puerto de descarga de `ingest-core`: fuentes
# de GitHub (API de trees + raw.githubusercontent.com) y detección de
# licencia (campo `license.spdx_id` de la API de repos). Todo lo que
# toca la red vive aquí, fuera del núcleo `std`-only. Sin cliente LLM:
# `skill_ingest` no sintetiza contenido con ningún modelo (ver el
# comentario de módulo de `src/lib.rs`).
[package]
name = "ingest-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `rt-multi-thread` para el puente síncrono `block_on` (block_in_place),
# igual que en supabase-store.
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
ingest-core = { path = "../ingest-core" }

[dev-dependencies]
memory-model = { path = "../memory-model" }
