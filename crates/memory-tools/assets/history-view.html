<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>okf-memory · línea de tiempo</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: #cbd5e1;
    --dot: #3b82f6;
    --chip-bg: #f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --line: #3a3f47;
      --dot: #60a5fa;
      --chip-bg: #22262e;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  #status { padding: 8px 12px; color: var(--muted); }
  #timeline { padding: 12px 16px; }
  .entry {
    position: relative;
    padding: 0 0 20px 22px;
    border-left: 2px solid var(--line);
  }
  .entry:last-child { border-left-color: transparent; }
  .entry::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot);
  }
  .reason { font-weight: 600; margin-bottom: 2px; }
  .meta { color: var(--muted); font-size: 11px; }
  .hash {
    display: inline-block;
    margin-top: 4px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--chip-bg);
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="status">Conectando con el host…</div>
<div id="timeline"></div>
<script>
(function () {
  "use strict";

  // Mismo transporte mínimo que graph-view.html — duplicado a
  // propósito: no hay build step ni módulo compartido entre las dos
  // vistas, cada HTML es autocontenido (ver capítulo 15 del tutorial).
  var nextId = 1;
  var pending = {};

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.id !== undefined && pending[data.id]) {
      var cb = pending[data.id];
      delete pending[data.id];
      if (data.error) cb.reject(data.error);
      else cb.resolve(data.result);
      return;
    }
    if (data.method === "ui/notifications/tool-result") {
      onToolResult(data.params);
    }
  });

  function sendRequest(method, params) {
    var id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
    });
  }

  function sendNotification(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
  }

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el) el.textContent = text;
  }

  sendRequest("ui/initialize", {
    protocolVersion: "2025-06-18",
    appCapabilities: {},
    clientInfo: { name: "okf-memory-history-view", version: "1" },
  })
    .then(function () {
      sendNotification("ui/notifications/initialized", {});
      setStatus("Esperando resultado de memory_history…");
    })
    .catch(function (err) {
      setStatus("No se pudo inicializar: " + JSON.stringify(err));
    });

  function onToolResult(params) {
    var payload = params && params.structuredContent;
    if (!payload && params && params.content && params.content[0] && params.content[0].text) {
      try {
        payload = JSON.parse(params.content[0].text);
      } catch (e) {
        setStatus("No se pudo leer el resultado: " + e.message);
        return;
      }
    }
    if (!payload || !payload.revisions) {
      setStatus("Resultado sin forma de memory_history.");
      return;
    }
    render(payload);
  }

  function render(payload) {
    setStatus("");
    var root = document.getElementById("timeline");
    root.textContent = "";
    if (payload.revisions.length === 0) {
      setStatus("Sin revisiones todavía para " + payload.concept_id + ".");
      return;
    }
    payload.revisions.forEach(function (rev) {
      var entry = document.createElement("div");
      entry.className = "entry";

      var reason = document.createElement("div");
      reason.className = "reason";
      reason.textContent = rev.reason;
      entry.appendChild(reason);

      var meta = document.createElement("div");
      meta.className = "meta";
      // No hay timestamp en el JSON de memory_history hoy — `seq` es
      // el único orden disponible (ver ejercicios, capítulo 15).
      meta.textContent = "seq " + rev.seq + " · " + rev.actor + " (" + rev.client_id + ")";
      entry.appendChild(meta);

      var hash = document.createElement("span");
      hash.className = "hash";
      hash.textContent = rev.result_hash.slice(0, 8) + (rev.base_hash ? " ← " + rev.base_hash.slice(0, 8) : " (creación)");
      entry.appendChild(hash);

      root.appendChild(entry);
    });
  }
})();
</script>
</body>
</html>
