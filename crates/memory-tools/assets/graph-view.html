<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>okf-memory · vista de grafo</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --edge: #cbd5e1;
    --broken: #f87171;
    --neighbor: #60a5fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --edge: #3a3f47;
      --broken: #f87171;
      --neighbor: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  #status {
    padding: 8px 12px;
    color: var(--muted);
  }
  svg { display: block; width: 100%; height: 100vh; }
  .edge { stroke: var(--edge); stroke-width: 1.5; }
  .node circle { stroke: var(--bg); stroke-width: 2; cursor: default; }
  .node text {
    fill: var(--fg);
    font-size: 10px;
    pointer-events: none;
  }
  .node.broken circle { fill: var(--broken); }
  title { white-space: pre; }
</style>
</head>
<body>
<div id="status">Conectando con el host…</div>
<svg id="canvas" viewBox="0 0 640 640"></svg>
<script>
(function () {
  "use strict";

  // --- Transporte MCP Apps mínimo: JSON-RPC 2.0 sobre postMessage. ---
  // No hace falta ningún SDK — es exactamente el patrón que documenta
  // el spec de la extensión (sección "Transport Layer").
  var nextId = 1;
  var pending = {};

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;
    if (data.id !== undefined && pending[data.id]) {
      var cb = pending[data.id];
      delete pending[data.id];
      if (data.error) cb.reject(data.error);
      else cb.resolve(data.result);
      return;
    }
    if (data.method === "ui/notifications/tool-result") {
      onToolResult(data.params);
    }
  });

  function sendRequest(method, params) {
    var id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
    return new Promise(function (resolve, reject) {
      pending[id] = { resolve: resolve, reject: reject };
    });
  }

  function sendNotification(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params }, "*");
  }

  function setStatus(text) {
    var el = document.getElementById("status");
    if (el) el.textContent = text;
  }

  // --- Handshake: ui/initialize -> ui/notifications/initialized. ---
  // El host no debe mandarnos nada (ni el resultado del tool) antes
  // de que completemos esto.
  sendRequest("ui/initialize", {
    protocolVersion: "2025-06-18",
    appCapabilities: {},
    clientInfo: { name: "okf-memory-graph-view", version: "1" },
  })
    .then(function () {
      sendNotification("ui/notifications/initialized", {});
      setStatus("Esperando resultado de memory_resolve…");
    })
    .catch(function (err) {
      setStatus("No se pudo inicializar: " + JSON.stringify(err));
    });

  // --- Datos: llegan como notificación tras el handshake. ---
  function onToolResult(params) {
    var payload = params && params.structuredContent;
    if (!payload && params && params.content && params.content[0] && params.content[0].text) {
      // El servidor de hoy solo manda el JSON como texto dentro de
      // `content[0].text` (no hay `structuredContent` todavía — ver
      // ejercicios del capítulo 15 del tutorial). Lo parseamos igual.
      try {
        payload = JSON.parse(params.content[0].text);
      } catch (e) {
        setStatus("No se pudo leer el resultado: " + e.message);
        return;
      }
    }
    if (!payload || !payload.document) {
      setStatus("Resultado sin forma de memory_resolve.");
      return;
    }
    render(payload);
  }

  // --- Coloreado determinista por doc_type — NO es una ontología, es
  // una función hash a una paleta fija de 8 colores. Solo conocemos el
  // doc_type del nodo raíz (memory_resolve no lo repite por vecino). ---
  var PALETTE = ["#f97316", "#22c55e", "#a855f7", "#eab308", "#ec4899", "#14b8a6", "#3b82f6", "#ef4444"];
  function hashColor(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  function render(payload) {
    setStatus("");
    var doc = payload.document;
    var neighborhood = payload.neighborhood || [];

    // Posiciones: raíz al centro; cada profundidad es un anillo, los
    // nodos de ese anillo repartidos uniformemente en ángulo. Es un
    // layout radial simple a propósito — nada de simulación de
    // fuerzas: con los tamaños acotados de este proyecto (presupuesto
    // de nodos/profundidad) es perfectamente legible sin depender de
    // ninguna librería de grafos.
    var cx = 320, cy = 320, ringStep = 90;
    var byDepth = {};
    neighborhood.forEach(function (v) {
      (byDepth[v.depth] = byDepth[v.depth] || []).push(v);
    });

    var pos = {};
    pos[doc.concept_id] = { x: cx, y: cy };
    Object.keys(byDepth).sort(function (a, b) { return a - b; }).forEach(function (depthKey) {
      var depth = Number(depthKey);
      var ring = byDepth[depthKey];
      var radius = ringStep * depth;
      ring.forEach(function (v, i) {
        var angle = (2 * Math.PI * i) / ring.length;
        pos[v.concept_id] = { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
      });
    });

    var svg = document.getElementById("canvas");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var ns = "http://www.w3.org/2000/svg";

    function edge(from, to) {
      if (!pos[from] || !pos[to]) return;
      var line = document.createElementNS(ns, "line");
      line.setAttribute("class", "edge");
      line.setAttribute("x1", pos[from].x);
      line.setAttribute("y1", pos[from].y);
      line.setAttribute("x2", pos[to].x);
      line.setAttribute("y2", pos[to].y);
      svg.appendChild(line);
    }
    function node(id, x, y, opts) {
      var g = document.createElementNS(ns, "g");
      g.setAttribute("class", "node" + (opts.broken ? " broken" : ""));
      g.setAttribute("transform", "translate(" + x + "," + y + ")");
      var circle = document.createElementNS(ns, "circle");
      circle.setAttribute("r", opts.r);
      if (opts.color) circle.setAttribute("fill", opts.color);
      var titleEl = document.createElementNS(ns, "title");
      titleEl.textContent = opts.tooltip || id;
      circle.appendChild(titleEl);
      g.appendChild(circle);
      var text = document.createElementNS(ns, "text");
      text.setAttribute("y", opts.r + 12);
      text.setAttribute("text-anchor", "middle");
      text.textContent = opts.label || id;
      g.appendChild(text);
      svg.appendChild(g);
    }

    // Aristas reales padre -> hijo (posibles gracias a
    // `Visited::parent` en graph-core).
    neighborhood.forEach(function (v) {
      if (v.parent) edge(v.parent, v.concept_id);
    });

    // Nodo raíz: coloreado por su doc_type real.
    node(doc.concept_id, cx, cy, {
      r: 18,
      color: hashColor(doc.type || ""),
      label: doc.concept_id,
      tooltip: (doc.title || doc.concept_id) + "\ntype: " + doc.type,
    });

    // Vecinos: no sabemos su doc_type (memory_resolve no lo trae), así
    // que usan un color neutro; rotos se marcan aparte.
    neighborhood.forEach(function (v) {
      if (!pos[v.concept_id]) return;
      node(v.concept_id, pos[v.concept_id].x, pos[v.concept_id].y, {
        r: 10,
        broken: !v.exists,
        color: v.exists ? "var(--neighbor)" : undefined,
        label: v.concept_id,
        tooltip: v.concept_id + (v.exists ? "" : " (enlace roto)"),
      });
    });

    if (payload.truncated && (payload.truncated.by_nodes || payload.truncated.by_depth || payload.truncated.by_bytes)) {
      setStatus("Resultado truncado por presupuesto (ver truncated en el JSON).");
    }
  }
})();
</script>
</body>
</html>
