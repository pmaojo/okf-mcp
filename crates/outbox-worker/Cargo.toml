# ADAPTADOR: dependencias externas permitidas
#
# Crate del worker de procesamiento Outbox en segundo plano.
[package]
name = "outbox-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Features mínimas: `macros`+`rt-multi-thread` para #[tokio::main] y
# `time` para el sleep del daemon; el resto lo activa sqlx.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-rustls"] }
pgvector = { version = "0.4", features = ["sqlx"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
gemini-embeddings = { path = "../gemini-embeddings" }
supabase-store = { path = "../supabase-store" }
