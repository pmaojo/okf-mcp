[package]
name = "mcp-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memory-model = { path = "../memory-model" }
memory-store = { path = "../memory-store" }
mcp-core = { path = "../mcp-core" }
mcp-stdio = { path = "../mcp-stdio" }

[dev-dependencies]
