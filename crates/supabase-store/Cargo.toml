# ADAPTADOR: dependencias externas permitidas
#
# Este crate implementa la persistencia utilizando Supabase (PostgreSQL)
# y requiere sqlx para la comunicación con la base de datos.
[package]
name = "supabase-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Features mínimas: `rt-multi-thread` para el puente síncrono `block_on`
# (block_in_place); el resto de drivers de tokio los activa sqlx.
tokio = { version = "1", features = ["rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-rustls"] }
pgvector = { version = "0.4", features = ["sqlx"] }
memory-model = { path = "../memory-model" }
store-core = { path = "../store-core" }
okf-core = { path = "../okf-core" }
hash-core = { path = "../hash-core" }
graph-core = { path = "../graph-core" }
conflict-core = { path = "../conflict-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
reqwest = { version = "0.12", features = ["json"] }
gemini-embeddings = { path = "../gemini-embeddings" }
