# ADAPTADOR: dependencias externas permitidas.
#
# Este es el ÚNICO crate del workspace donde eso es cierto (aparte de
# la dev-dependency de test en mcp-http). El runtime de Vercel para
# Rust exige tokio + vercel_runtime (con su feature "axum" para tener
# control total de status/cabeceras); no existe una forma std-only de
# arrancar una función serverless de Vercel. Todo lo demás que este
# crate importa (mcp-http, mcp-core, memory-store, ...) sigue siendo
# 100% std por debajo. Ver tutorial/11-adaptador-vercel.md.
[package]
name = "vercel-entry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Features mínimas: `macros`+`rt-multi-thread` para #[tokio::main] y
# `sync` para el RwLock de la caché JWKS. El binario de Vercel paga
# cada feature en arranque en frío (criterio 3 de la-rueda-de-serie).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
vercel_runtime = { version = "2.4", features = ["axum"] }
axum = { version = "0.8" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors"] }
memory-model = { path = "../memory-model" }
memory-store = { path = "../memory-store" }
mcp-core = { path = "../mcp-core" }
mcp-http = { path = "../mcp-http" }
memory-tools = { path = "../memory-tools" }
supabase-store = { path = "../supabase-store" }
outbox-worker = { path = "../outbox-worker" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "tls-rustls"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[[bin]]
name = "outbox"
path = "api/outbox.rs"
