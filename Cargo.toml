[workspace]
# Resolver v3: tiene en cuenta rust-version (MSRV) al elegir versiones
# de dependencias — ver [workspace.package].
resolver = "3"
members = [
    "crates/memory-model",
    "crates/hash-core",
    "crates/json-mini",
    "crates/okf-core",
    "crates/graph-core",
    "crates/conflict-core",
    "crates/store-core",
    "crates/memory-store",
    "crates/memory-tools",
    "crates/mcp-core",
    "crates/mcp-stdio",
    "crates/mcp-http",
    "crates/vercel-entry", "crates/supabase-store", "crates/outbox-worker",
    "crates/gemini-embeddings",
    "crates/ingest-core",
    "crates/ingest-http",
    "crates/github-store",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
# MSRV = el rustc del builder de Rust de Vercel. El resolver de Cargo
# la respeta: descarta versiones de dependencias que pidan un rustc
# más nuevo (p.ej. sqlx 0.9 exige 1.94).
rust-version = "1.92"
# Ningún crate del workspace se publica en crates.io: son piezas de
# este proyecto/tutorial, no bibliotecas de propósito general.
publish = false

# Perfil de release compartido por todo el workspace (Cargo ignora
# [profile.*] declarado en un Cargo.toml de crate miembro: solo se
# lee aquí, en la raíz). El binario de Vercel lo necesita para
# arrancar en frío con la menor latencia posible.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

# Regla del proyecto: ningún crate de este workspace declara dependencias
# externas en el hito 1. Solo `std` y dependencias internas (path).
